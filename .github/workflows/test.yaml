name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Compile and test the backend with the committed lockfile
        run: cargo +1.99.1 test --locked --manifest-path packages/backend/Cargo.toml

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Test upstream update selection and safeguards
        run: python3 scripts/test_upstream_update.py

      # Node
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: 'pnpm'
          node-version-file: '.nvmrc'

      # Docker
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          install: true

      - name: Install dependencies and validate the frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run test:security
          pnpm --filter @cryptgeon/web exec svelte-kit sync
          pnpm --filter @cryptgeon/web check
          pnpm run build

      - name: Prepare Docker and browsers for end-to-end tests
        run: |
          pnpm exec playwright install --with-deps
          pnpm run docker:build

      - name: Run your tests
        run: pnpm test

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
