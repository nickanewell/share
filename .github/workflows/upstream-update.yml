name: Propose upstream update

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:
    inputs:
      propose:
        description: 'Explicitly allow a branch and draft PR for a newer stable release'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: upstream-update
  cancel-in-progress: false

jobs:
  discover:
    if: >-
      github.repository == 'nickanewell/share' &&
      (vars.ENABLE_UPSTREAM_UPDATES == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.propose))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      available: ${{ steps.release.outputs.available }}
      tag: ${{ steps.release.outputs.tag }}
      branch: ${{ steps.release.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Find a newer stable release within the configured major
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/upstream_update.py discover --github-output "$GITHUB_OUTPUT"
      - name: Summarize release selection
        env:
          TAG: ${{ steps.release.outputs.tag }}
          MAJOR: ${{ steps.release.outputs.major_available }}
        run: |
          if [ -n "$TAG" ]; then
            echo "Stable update available: $TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No newer stable release within the configured major." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$MAJOR" ]; then
            echo "New major $MAJOR requires a separate manual migration." >> "$GITHUB_STEP_SUMMARY"
          fi

  propose:
    needs: discover
    if: needs.discover.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Leave existing proposal branches untouched
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.discover.outputs.branch }}
        run: |
          gh auth setup-git
          set +e
          git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null
          result=$?
          set -e
          case "$result" in
            0)
              echo 'exists=true' >> "$GITHUB_OUTPUT"
              echo "Proposal branch $BRANCH already exists; it was not rewritten. Review it manually." >> "$GITHUB_STEP_SUMMARY"
              ;;
            2) echo 'exists=false' >> "$GITHUB_OUTPUT" ;;
            *) exit "$result" ;;
          esac
      - name: Prepare the upstream delta without executing upstream code
        if: steps.branch.outputs.exists == 'false'
        env:
          UPSTREAM_TAG: ${{ needs.discover.outputs.tag }}
        run: |
          cp scripts/upstream_update.py "$RUNNER_TEMP/upstream_update.py"
          python3 "$RUNNER_TEMP/upstream_update.py" prepare --tag "$UPSTREAM_TAG" --body-file "$RUNNER_TEMP/upstream-pr.md"
      - name: Open a draft update for human review
        if: steps.branch.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          UPSTREAM_TAG: ${{ needs.discover.outputs.tag }}
          BRANCH: ${{ needs.discover.outputs.branch }}
        run: |
          # Empty expected SHA is a create-only lease: even a racing branch
          # creation cannot cause this push to replace an existing branch.
          git push --force-with-lease="refs/heads/$BRANCH:" origin "HEAD:refs/heads/$BRANCH"
          gh pr create --draft --base "$BASE" --head "$BRANCH" \
            --title "Update Cryptgeon to $UPSTREAM_TAG" \
            --body-file "$RUNNER_TEMP/upstream-pr.md"
          echo "Draft PR opened. Approve its workflows if requested, then review CI and deployment manually." >> "$GITHUB_STEP_SUMMARY"
