name: Release information

# Publishing is deliberately inactive in this fork. This manual information job
# does not build, authenticate to a registry, publish, or deploy anything.
on:
  workflow_dispatch:

permissions: {}

jobs:
  information:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain the local release boundary
        run: |
          echo "Publishing is not configured for Rival IT Share."
          echo "Review docs/upstream-maintenance.md before defining a separate release process."
          echo "No package, image, tag, or deployment has been published."
